services:
  HealthLogger:
    build:
      context: .
      dockerfile: HealthLogger/Dockerfile
    container_name: HealthLogger-app
    ports:
      - "5076:8080"
    environment:
      - DatabaseProvider=SqlServer
      - ConnectionStrings__SqlServer=Server=sqlserver;Database=HealthLogger;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True
      - AccessControl__AllowedTenantIds=
      - AccessControl__AllowedUserIds=
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - HealthLogger-network

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: HealthLogger-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@Passw0rd
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - HealthLogger-network
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P YourStrong@Passw0rd -C -Q "SELECT 1"
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sqlserver_data:
    driver: local

networks:
  HealthLogger-network:
    driver: bridge
